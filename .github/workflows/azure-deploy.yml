name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

env:
  RESOURCE_GROUP: ytsum-rg
  REGISTRY_NAME: ytsumregistry
  BACKEND_APP_NAME: ytsum-backend
  WORKER_APP_NAME: ytsum-celery-worker
  FRONTEND_APP_NAME: ytsum-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-backend:${{ github.sha }} \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-backend:latest \
            ./backend --push

      - name: Build and push frontend image
        run: |
          docker buildx build --platform linux/amd64 --target production \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-frontend:latest \
            ./frontend --push

      - name: Update backend container app
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-backend:${{ github.sha }}

      - name: Update celery worker container app
        run: |
          az containerapp update \
            --name ${{ env.WORKER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-backend:${{ github.sha }}

      - name: Update frontend container app
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/ytsum-frontend:${{ github.sha }}

      - name: Run database migrations
        run: |
          az containerapp exec \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --command "alembic upgrade head"
        continue-on-error: true

      - name: Get application URLs
        id: urls
        run: |
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          FRONTEND_URL=$(az containerapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "backend_url=https://${BACKEND_URL}" >> $GITHUB_OUTPUT
          echo "frontend_url=https://${FRONTEND_URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo ""
          echo "Application URLs:"
          echo "  Frontend: ${{ steps.urls.outputs.frontend_url }}"
          echo "  Backend:  ${{ steps.urls.outputs.backend_url }}"
          echo ""
          echo "Git SHA: ${{ github.sha }}"
